<!doctype html>
<!-- Template of the pre-built content pages (build/contentPages). The head mirrors index.html; the build fills in each page's own title, description and address, then deletes this file from dist. -->
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take-home pay estimate for a yearly salary</title>
    <meta
      name="description"
      content="Pick your province, type a yearly salary and see what you take home after income tax, CPP and EI. It is an estimate, not tax advice."

    <meta
      name="theme-color"
      content="#f4f5f3"

    <meta
      name="theme-color"
      content="#121614"
      media="(prefers-color-scheme: dark)"

    <link rel="icon" href="/favicon.ico" sizes="48x48" />

      property="og:title"

    />

      property="og:description"
      content="Pick your province, type a yearly salary and see what you take home after income tax, CPP and EI. It is an estimate, not tax advice."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Take-home pay estimate for a yearly salary"
    />

      name="twitter:description"
      content="Pick your province, type a yearly salary and see what you take home after income tax, CPP and EI. It is an estimate, not tax advice."
