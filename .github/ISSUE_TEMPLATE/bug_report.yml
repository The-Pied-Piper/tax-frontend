name: Bug report
description: Something on the page does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The salary, province and year you entered, and your browser.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: the commit hash
