name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the committed spec
        run: npm run api:check
      - run: npm run check
      - run: npm run build
  spec-drift:
    # The committed spec must equal the one tax-service publishes on main.
    # tax-service is public, so no token is needed and the check runs on
    # every pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare api/openapi.yml with tax-service main
        run: |
          curl -fsS -o /tmp/published.yml https://raw.githubusercontent.com/The-Pied-Piper/tax-service/main/openapi/openapi.yml
          test -s /tmp/published.yml || { echo "::error::downloaded spec is empty"; exit 1; }
          diff -u api/openapi.yml /tmp/published.yml || { echo "::error::api/openapi.yml differs from tax-service. Run: npm run api:sync"; exit 1; }
