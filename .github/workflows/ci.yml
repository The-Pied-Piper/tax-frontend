name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the committed spec
        run: npm run api:check
      - run: npm run check
      - run: npm run build
  engine-figures:
    # The Python step that the deploy builds run: it must install from the pinned, hashed
    # requirements, run, and write answers that fit api/openapi.yml for every page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      # The same resolver as the dev deploy: CI tests the engine release dev will build with.
      - run: |
          python -I build/localEngine/resolve_pin.py main build/localEngine/requirements.txt "$RUNNER_TEMP/engine-requirements.txt"
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/engine-requirements.txt"
      - run: python -I build/localEngine/engine_figures.py build/salaryPages/provinces.json "$RUNNER_TEMP/engine-figures.json"
      - name: Check the written figures
        env:
          ENGINE_FIGURES_FILE: ${{ runner.temp }}/engine-figures.json
        run: npx vitest run build/localEngine/engineFigures.test.ts
  spec-drift:
    # The committed spec must equal the one tax-service publishes on main.
    # tax-service is public, so no token is needed and the check runs on
    # every pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare api/openapi.yml with tax-service main
        run: |
          curl -fsS -o /tmp/published.yml \
            https://raw.githubusercontent.com/The-Pied-Piper/tax-service/main/openapi/openapi.yml
          test -s /tmp/published.yml \
            || { echo "::error::downloaded spec is empty"; exit 1; }
          diff -u api/openapi.yml /tmp/published.yml \
            || { echo "::error::api/openapi.yml differs from tax-service. Run: npm run api:sync"; exit 1; }
