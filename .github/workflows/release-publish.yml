name: Release publish

# Reusable: called by release.yml on main, and the only file the release trigger can reach.
# One file holds the whole chain, build then deploy, so the caller (which comes from the
# tagged commit and could be edited by anyone who can push a tag) cannot insert, skip or
# replace a job: it can only call this file as it is on main. The AWS role trusts only this
# file as it is on main (job_workflow_ref), only a v tag, and only the GitHub environment
# prod-deploy, which needs the owner's approval.
#
# build: runs npm on the released commit with no cloud credentials at all (no id-token, no
# environment) and hands the finished site (dist/) to deploy as a workflow artifact. The
# prod API must be up before a release is published: the build calls it once per page, and if
# it fails nothing is published.
# deploy: waits in prod-deploy for approval, never runs npm, uploads the artifact in the dev
# order and, after the stale assets are deleted, refreshes the whole CDN. Until the prod site
# exists (tax-infra creates the bucket, distribution and role) the variables below are unset
# and it ends green without deploying.
# Actions are pinned by commit; Dependabot (github-actions) keeps the tags in the comments current.

on:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The prod API and the public address, set at build time (see README, "API client").
      VITE_API_BASE_URL: https://api.aftertaxlens.com/api/v1
      VITE_SITE_URL: https://aftertaxlens.com
    steps:
      - name: Check this is a release with a v-and-number tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == release ]] || { echo "not a release event" >&2; exit 1; }
          [[ "$TAG" =~ ^v[1-9][0-9]{0,5}$ ]] || { echo "unexpected release tag" >&2; exit 1; }
          [[ "$REF" == "refs/tags/$TAG" ]] || { echo "the run is not for the release tag" >&2; exit 1; }

      # The released commit, with full history so it can be compared with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The released commit must already be on main (main only takes reviewed pull
      # requests with green CI): a tag on any other commit is refused before anything is built.
      - name: Check the commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "the released commit is not on main" >&2; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Nothing is published unless the build produced a page and the sitemap.
      - name: Check the build
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -d dist/assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Variables of this environment (not secrets): AWS_SITE_DEPLOY_ROLE_ARN_PROD,
    # SITE_BUCKET_PROD and SITE_DISTRIBUTION_ID_PROD. The role trusts only this environment.
    environment: prod-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check this is a release and the prod site is set up
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          ROLE_ARN: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN_PROD }}
          BUCKET: ${{ vars.SITE_BUCKET_PROD }}
          DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID_PROD }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == release ]] || { echo "not a release event" >&2; exit 1; }
          [[ "$TAG" =~ ^v[1-9][0-9]{0,5}$ ]] || { echo "unexpected release tag" >&2; exit 1; }
          [[ "$REF" == "refs/tags/$TAG" ]] || { echo "the run is not for the release tag" >&2; exit 1; }
          [[ "$PRERELEASE" == false ]] || { echo "a pre-release does not go to prod" >&2; exit 1; }
          if [[ -z "$ROLE_ARN" && -z "$BUCKET" && -z "$DISTRIBUTION_ID" ]]; then
            echo "::warning::Not deployed: the prod site is not set up yet (no role, bucket or distribution)."
            echo "Not deployed: no prod site yet." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # Some set and some not is a misconfiguration, not "not set up yet".
            [[ -n "$ROLE_ARN" && -n "$BUCKET" && -n "$DISTRIBUTION_ID" ]] || { echo "only some of the prod site variables are set" >&2; exit 1; }
            [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]] || { echo "unexpected role arn" >&2; exit 1; }
            [[ "$BUCKET" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]] || { echo "unexpected bucket name" >&2; exit 1; }
            [[ "$DISTRIBUTION_ID" =~ ^E[A-Z0-9]{8,20}$ ]] || { echo "unexpected distribution id" >&2; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Repeated here, before the download: the caller file comes from the tagged commit, so on a
      # commit that is not on main it could add a job of its own that uploads a different `site`
      # while this job waits for approval. A commit on main has a reviewed caller. Asks GitHub
      # (no checkout, no repository code runs): main must be the same as, or ahead of, this commit.
      - name: Check the commit is on main
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          [[ "$status" == ahead || "$status" == identical ]] || { echo "the released commit is not on main" >&2; exit 1; }

      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.check.outputs.ready == 'true' }}
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: ${{ steps.check.outputs.ready == 'true' }}
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN_PROD }}
          role-session-name: tax-frontend-release-publish-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ca-central-1

      # Same order as dev: files under assets/ have a hash in their name, so they never
      # change and can be cached for a year; everything else keeps its name and must be
      # asked for each time. New assets go up first, the page files second, and only then
      # are the old assets removed (the bucket keeps their old versions).
      - name: Upload the site
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          BUCKET: ${{ vars.SITE_BUCKET_PROD }}
        run: |
          set -euo pipefail
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --exclude "mockServiceWorker.js" --cache-control "no-cache"
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"

      # Last, and always after the --delete above: cached pages at the edge point at hashed
      # files, so they must be dropped once the old files are gone. It also runs when an
      # upload step failed part-way (some old assets may already be deleted), but not when
      # the run was cancelled before the upload.
      - name: Refresh the CDN
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' && steps.download.outcome == 'success' }}
        env:
          DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID_PROD }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
