name: Release

# Publishing a GitHub release (a tag like v1 or v2) builds that commit's site and publishes it
# to prod. This file is only the trigger: it comes from the tagged commit, so it holds no
# logic and no credentials of its own, and it has exactly one job, which calls
# release-publish.yml as it is on main. The whole chain (checks, build with no cloud access,
# approval, deploy that never runs npm) lives in that one file, so nothing can be inserted or
# skipped here. The prod AWS role trusts only that file as it is on main (and only a v tag,
# and only the GitHub environment prod-deploy, which needs the owner's approval).
# See release-publish.yml.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  # One release at a time, and never cancel one half-way. (A convenience, not a guard: this
  # file comes from the tagged commit.)
  group: release-prod
  cancel-in-progress: false

jobs:
  publish:
    # A pre-release does not go to prod (release-publish.yml checks this again).
    if: ${{ !github.event.release.prerelease }}
    # The most the called file may use: its build job narrows itself to contents: read.
    permissions:
      contents: read
      id-token: write
    uses: The-Pied-Piper/tax_frontend/.github/workflows/release-publish.yml@main
