name: Deploy dev

# Builds the site and publishes it to the dev bucket on every merge to main (main is
# meant to take only pull requests with green CI: that is a repository setting, and
# the repository variables below must not be set until it is on), using a short-lived OIDC role (no stored
# keys). Two jobs, as in release-publish.yml: build runs tax-engine (a release this repository
# does not review, see build/localEngine/resolve_pin.py) and npm with no cloud credentials at all
# and hands the finished site (dist/) to deploy as a workflow artifact; deploy holds the right to
# assume the role and runs neither npm nor Python nor any script of this repository. It does nothing until the repository variables AWS_SITE_DEPLOY_ROLE_ARN_DEV,
# SITE_BUCKET_DEV and SITE_DISTRIBUTION_ID_DEV are set, which happens once tax-infra
# has created the dev site and the role. Prod is a separate workflow, on release.
# Actions are pinned by commit; Dependabot (github-actions) keeps the tags in the comments current.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    # Variables, not secrets: role ARNs, bucket names and distribution ids are not secret.
    # main only, also for a manual run: the role trusts nothing else.
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_SITE_DEPLOY_ROLE_ARN_DEV != '' && vars.SITE_BUCKET_DEV != '' && vars.SITE_DISTRIBUTION_ID_DEV != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The dev API, set at build time (see DEVELOPMENT.md, "API client"); the build asks it only which jurisdictions it serves. VITE_SITE_URL stays
      # unset: dev has no canonical address and no sitemap. (Search engines are kept away by
      # the X-Robots-Tag header that tax-infra's site sends for dev, not by this build.)
      VITE_API_BASE_URL: https://api-dev.aftertaxlens.com/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The site's figures come from tax-engine run here, not from an API: one Python step,
      # the tax-engine release tax-service itself pins (build/localEngine/resolve_pin.py reads it
      # by commit sha; any failure fails this build, there is no fallback), hashes from PyPI, no
      # network use after the install. The Node build reads the file it writes.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Compute the site's figures with tax-engine
        run: |
          set -euo pipefail
          python -I build/localEngine/resolve_pin.py main build/localEngine/requirements.txt "$RUNNER_TEMP/engine-requirements.txt"
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/engine-requirements.txt"
          python -I build/localEngine/engine_figures.py build/salaryPages/provinces.json "$RUNNER_TEMP/engine-figures.json"

      # No install scripts, and no cloud credentials in this job: it never holds the publishing role.
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          ENGINE_FIGURES_FILE: ${{ runner.temp }}/engine-figures.json

      # Nothing is published unless the build wrote the salary pages (they need the engine file).
      - name: Check the build
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/ca-on/70000/index.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Variables, not secrets: role ARNs, bucket names and distribution ids are not secret.
    # main only, also for a manual run: the role trusts nothing else.
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_SITE_DEPLOY_ROLE_ARN_DEV != '' && vars.SITE_BUCKET_DEV != '' && vars.SITE_DISTRIBUTION_ID_DEV != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN_DEV }}
          role-session-name: tax-frontend-deploy-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ca-central-1

      # Files under assets/ have a hash in their name, so they never change and can be
      # cached for a year. Everything else (index.html, theme-init.js, the share image)
      # keeps its name from build to build, so browsers must ask each time. Order matters
      # while the old page is still live: new assets go up first, the page files second,
      # and only then are the old assets removed (the bucket keeps their old versions).
      # mockServiceWorker.js is a development file and is not published.
      - name: Upload the site
        env:
          BUCKET: ${{ vars.SITE_BUCKET_DEV }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --exclude "mockServiceWorker.js" --cache-control "no-cache"
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"

      - name: Refresh the CDN
        env:
          DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID_DEV }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
