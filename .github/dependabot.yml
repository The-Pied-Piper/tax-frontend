version: 2
updates:
  # One pull request a month per group, so updates stay one review each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
