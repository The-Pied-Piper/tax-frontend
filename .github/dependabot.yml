version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # The committed pins in build/localEngine: tax-engine is for running the step by hand (deploy
  # builds follow the release tax-service pins, build/localEngine/resolve_pin.py), but the PyYAML
  # pin is the one deploy builds install, so a bump of it here changes them.
  - package-ecosystem: pip
    directory: /build/localEngine
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
