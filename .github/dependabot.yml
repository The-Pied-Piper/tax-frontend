version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # The committed tax-engine pin in build/localEngine: it is for running the step by hand. Deploy
  # builds follow the release tax-service pins (build/localEngine/resolve_pin.py), not this file.
  - package-ecosystem: pip
    directory: /build/localEngine
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
